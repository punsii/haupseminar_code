[project]
name = "rt3dgs-poc"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = ["numpy", "imageio"]

[project.optional-dependencies]
cpu = ["torch==2.7.1"]
cu128 = ["torch==2.7.1", "gsplat==1.5.3"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu128" }]]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu128", extra = "cu128" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
